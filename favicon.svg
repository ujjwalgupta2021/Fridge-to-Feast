<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <!-- Background Gradient for Cozy Sloth Tile -->
    <linearGradient id="tileGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" class="tile-stop-1" />
      <stop offset="100%" stop-color="#fef3c7" class="tile-stop-2" />
    </linearGradient>

    <!-- Vibrant Pure Veg Emerald Gradient -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <style>
      .tile-bg { fill: url(#tileGrad); stroke: #2b2420; stroke-width: 2.5; }
      .sloth-head { fill: #c49a6c; stroke: #2b2420; stroke-width: 1.5; }
      .sloth-mask { fill: #7c4f26; }
      .sloth-muzzle { fill: #fbf5e8; stroke: #2b2420; stroke-width: 1.2; }
      .sloth-nose { fill: #2b2420; }
      .sloth-feature { stroke: #2b2420; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .chef-toque { fill: #ffffff; stroke: #2b2420; stroke-width: 2; stroke-linejoin: round; }
      .chef-band { fill: #f3f4f6; stroke: #2b2420; stroke-width: 1.8; }
      .sprout-leaf { fill: url(#emeraldGrad); stroke: #065f46; stroke-width: 1.2; }
      .cheeks { fill: #f87171; opacity: 0.55; }

      @media (prefers-color-scheme: dark) {
        .tile-stop-1 { stop-color: #2a211a; }
        .tile-stop-2 { stop-color: #181310; }
        .tile-bg { stroke: #52453e; }
        .sloth-head { stroke: #3e3128; }
        .chef-band { fill: #e5e7eb; }
      }
    </style>
  </defs>

  <!-- Tactile Rounded Squircle Tile -->
  <rect x="3" y="3" width="58" height="58" rx="16" class="tile-bg" />

  <!-- Sloth Head Base -->
  <ellipse cx="32" cy="40" rx="20" ry="16" class="sloth-head" />

  <!-- Classic Sloth Eye Patches -->
  <path d="M 23 34 C 19 34, 16 38, 18 43 C 21 46, 26 43, 27 38 C 28 35, 26 34, 23 34 Z" class="sloth-mask" />
  <path d="M 41 34 C 45 34, 48 38, 46 43 C 43 46, 38 43, 37 38 C 36 35, 38 34, 41 34 Z" class="sloth-mask" />

  <!-- Light Muzzle -->
  <ellipse cx="32" cy="44" rx="9.5" ry="7" class="sloth-muzzle" />

  <!-- Sweet Nose & Sleepy Smile -->
  <ellipse cx="32" cy="42" rx="2.5" ry="1.8" class="sloth-nose" />
  <path d="M 30.5 45 Q 32 47.5 33.5 45" class="sloth-feature" />

  <!-- Relaxed, Smiling Sloth Eyes (^ ^) -->
  <path d="M 20 38.5 Q 23 35.5 26 38.5" class="sloth-feature" />
  <path d="M 38 38.5 Q 41 35.5 44 38.5" class="sloth-feature" />

  <!-- Rosy Lazy Cheeks -->
  <circle cx="16" cy="44" r="3" class="cheeks" />
  <circle cx="48" cy="44" r="3" class="cheeks" />

  <!-- Chef Hat (Toque) - Tilted Cozily on Head -->
  <g transform="rotate(-6 32 18)">
    <!-- Fluffy Hat Crown -->
    <path d="M 21 19 C 15 15, 17 6, 27 7 C 30 2, 38 2, 41 7 C 49 5, 52 14, 46 19 Z" class="chef-toque" />
    <!-- Hat Crease Folds -->
    <path d="M 27 9 Q 29 15 30 18" stroke="#d1d5db" stroke-width="1.2" stroke-linecap="round" fill="none" />
    <path d="M 38 9 Q 37 15 36 18" stroke="#d1d5db" stroke-width="1.2" stroke-linecap="round" fill="none" />
    <!-- Hat Base Band -->
    <rect x="22" y="17" width="22" height="6.5" rx="2" class="chef-band" />
  </g>

  <!-- Pure Veg Emerald Sprout (Tucked proudly into Hat) -->
  <path d="M 43 14 C 43 7, 52 6, 54 11 C 54 16, 47 17, 43 14 Z" class="sprout-leaf" />
  <path d="M 43 14 Q 48 11.5 52 9.5" stroke="#065f46" stroke-width="0.9" stroke-linecap="round" fill="none" />
</svg>
